{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="error-container">
    <div class="container error-content">
        <div class="error-code">404</div>
        <h1>Страница не найдена</h1>
        <p>Такой страницы не существует, либо она была перемещена.</p>
        <div class="error-actions">
            <a href="{{ url_for('public.landing') }}" class="btn btn-primary">На главную</a>
            {% if g.current_user %}
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">В дашборд</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.error-container {
    min-height: calc(100vh - 72px - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
}

.error-content {
    text-align: center;
    max-width: 480px;
}

.error-code {
    font-family: var(--font-display);
    font-size: 6rem;
    font-weight: 700;
    line-height: 1;
    background: var(--gradient-hero);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
}

.error-content h1 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    margin-bottom: 12px;
}

.error-content p {
    color: var(--text-secondary);
    margin-bottom: 32px;
}

.error-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
}
</style>
{% endblock %}
