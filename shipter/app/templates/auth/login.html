{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card">
        <h1 class="auth-title">Вход в Shipter</h1>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="you@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
            </div>

            <p class="auth-forgot"><a href="{{ url_for('auth.forgot_password') }}">Забыли пароль?</a></p>

            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        
        <div class="auth-divider">
            <span>или</span>
        </div>
        
        <a href="{{ url_for('auth.google_login') }}" class="btn btn-secondary btn-block">
            Войти через Google
        </a>
        
        <p class="auth-footer">
            Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a>
        </p>
        <p class="auth-footer">
            Не пришло письмо подтверждения? <a href="{{ url_for('auth.resend_verification') }}">Отправить снова</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 72px - 200px);
    padding: 48px 24px;
}

.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 40px;
}

.auth-title {
    font-family: var(--font-display);
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 32px;
}

.auth-form {
    margin-bottom: 24px;
}

.auth-forgot {
    text-align: right;
    margin: -8px 0 20px;
    font-size: 0.875rem;
}

.auth-forgot a {
    color: var(--text-secondary);
}

.auth-forgot a:hover {
    color: var(--accent-primary);
}

.auth-divider {
    display: flex;
    align-items: center;
    margin: 24px 0;
    color: var(--text-muted);
}

.auth-divider::before,
.auth-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-subtle);
}

.auth-divider span {
    padding: 0 16px;
    font-size: 0.875rem;
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    color: var(--text-secondary);
}

.auth-footer a {
    color: var(--accent-primary);
}

.auth-footer a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
