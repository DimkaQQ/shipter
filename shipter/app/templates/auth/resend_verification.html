{% extends "base.html" %}

{% block title %}Подтверждение email{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card">
        <h1 class="auth-title">Не пришло письмо?</h1>
        <p class="auth-subtitle">Введите email — мы отправим ссылку подтверждения ещё раз.</p>

        <form method="POST" action="{{ url_for('auth.resend_verification') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="you@example.com">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Отправить письмо снова</button>
        </form>

        <p class="auth-footer">
            <a href="{{ url_for('auth.login') }}">Вернуться ко входу</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 72px - 200px);
    padding: 48px 24px;
}

.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 40px;
}

.auth-title {
    font-family: var(--font-display);
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 8px;
}

.auth-subtitle {
    text-align: center;
    color: var(--text-secondary);
    margin-bottom: 32px;
}

.auth-form {
    margin-bottom: 24px;
}

.auth-footer {
    text-align: center;
    margin-top: 24px;
    color: var(--text-secondary);
}

.auth-footer a {
    color: var(--accent-primary);
}

.auth-footer a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
