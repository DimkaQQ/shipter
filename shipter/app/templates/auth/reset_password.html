{% extends "base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card">
        <h1 class="auth-title">Задайте новый пароль</h1>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="password">Новый пароль</label>
                <input type="password" id="password" name="password" class="form-input" required minlength="8" placeholder="Минимум 8 символов">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Сохранить пароль</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 72px - 200px);
    padding: 48px 24px;
}

.auth-card {
    width: 100%;
    max-width: 420px;
    padding: 40px;
}

.auth-title {
    font-family: var(--font-display);
    font-size: 1.75rem;
    text-align: center;
    margin-bottom: 32px;
}

.auth-form {
    margin-bottom: 24px;
}
</style>
{% endblock %}
