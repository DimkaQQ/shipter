{% extends "base.html" %}

{% block title %}Оплата успешна — Shipter{% endblock %}

{% block content %}
<div class="success-container">
    <div class="container">
        <div class="success-card card">
            <div class="success-icon">✅</div>
            <h1>Оплата успешна!</h1>
            <p class="success-message">Ваша подписка активирована. Добро пожаловать в Shipter!</p>
            <div class="success-actions">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Перейти в дашборд</a>
                <a href="{{ url_for('projects.create_project') }}" class="btn btn-outline">Создать первый проект</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.success-container {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
}

.success-card {
    max-width: 500px;
    text-align: center;
    padding: 48px;
}

.success-icon {
    font-size: 5rem;
    margin-bottom: 24px;
    animation: successPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes successPop {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.success-card h1 {
    font-family: var(--font-display);
    font-size: 2rem;
    margin-bottom: 16px;
    background: var(--gradient-hero);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.success-message {
    color: var(--text-secondary);
    font-size: 1.1rem;
    margin-bottom: 32px;
}

.success-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

@media (max-width: 768px) {
    .success-card {
        padding: 32px 24px;
    }
}
</style>
{% endblock %}
